[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "json-resume"
version = "1.1.1"
description = "Strict JSON-to-DOCX resume generator with locale-aware Word layout"
readme = { file = "PYPI.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Eric Zhou" },
]
keywords = ["resume", "json", "docx", "word", "cv"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "python-docx==1.2.0",
  "docx2pdf==0.1.8",
  "pypdf==6.10.0",
]

[project.scripts]
json-resume = "resume_generator.cli:main"

[project.urls]
Homepage = "https://github.com/Eric-Zhou-0302/JSON-Resume"
Repository = "https://github.com/Eric-Zhou-0302/JSON-Resume.git"
Issues = "https://github.com/Eric-Zhou-0302/JSON-Resume/issues"
Changelog = "https://github.com/Eric-Zhou-0302/JSON-Resume/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["resume_generator*"]
